<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>大肥鱼 · AI 面试官（手机版）</title>
<style>
  :root { --bg:#0b1420; --ink:#e8eef7; --dim:#8fa3bb; --line:#1e2c3d; --gold:#e0b872; --ok:#7fd1a0; --warn:#e8b34b; --bad:#e06c6c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 420px; height: 100%; }
  #stageWrap { position: relative; overflow: hidden; }
  #bgLayer { position: absolute; inset: 0; background: #0b1420 url('') center/cover no-repeat;
    opacity: .42; filter: saturate(.8) brightness(.9); }
  #bgLayer::after { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(6,12,22,.22), rgba(6,12,22,.78) 60%, rgba(6,12,22,.95) 100%); }
  #stage { position: absolute; inset: 0; }
  #caption { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    max-width: 82%; padding: 10px 16px; border-radius: 10px;
    background: rgba(6,12,22,.82); border: 1px solid rgba(224,184,114,.3);
    font-size: 15px; opacity: 0; transition: opacity .18s; pointer-events: none; }
  #caption.on { opacity: 1; }
  #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px;
    text-align: center; background: rgba(6,12,22,.85); z-index: 5; }
  #loading small { color: var(--dim); }
  button.ghost { background: transparent; border-color: var(--line); color: var(--dim); font-size: 12px; padding: 5px 10px; }
  #textStage[hidden] { display: none !important; }
  #textStage { position: absolute; inset: 0; display: grid; place-content: center; padding: 20px; z-index: 3; }
  #textStage .tcard { max-width: 420px; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    background: rgba(11,20,32,.86); }
  #errBar { position: fixed; left: 0; right: 0; top: 0; z-index: 99; display: none;
    background: #4a1414; color: #ffd6d6; font-size: 12px; padding: 8px 12px; }
  aside { border-left: 1px solid var(--line); background: #0b1420; padding: 16px 16px 40px; overflow: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .chip.on { border-color: var(--gold); color: var(--gold); background: rgba(224,184,114,.1); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .label { font-size: 12px; color: var(--gold); margin-bottom: 6px; letter-spacing: .04em; }
  .q { font-size: 15px; line-height: 1.7; }
  textarea { width: 100%; min-height: 108px; resize: vertical; background: #0f1a28; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: #16233a; color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--gold); border-color: var(--gold); color: #17202e; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .bar { height: 6px; border-radius: 3px; background: #16233a; overflow: hidden; margin: 4px 0 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6ea8d8, var(--gold)); }
  .dim { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
  #scoreNum { font-size: 34px; font-weight: 700; }
  #verdict { font-size: 12px; color: var(--dim); margin-left: 6px; }
  #subs { font-size: 12px; color: var(--dim); line-height: 1.7; }
  ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  li { margin: 2px 0; }
  #log { font-size: 11px; color: #6f849c; max-height: 130px; overflow: auto; white-space: pre-wrap; }
  .redline { border: 1px solid var(--bad); color: #ffb4b4; background: rgba(224,108,108,.12);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; }
    #caption { font-size: 13px; line-height: 1.55; padding: 7px 11px; bottom: 10px; max-width: 94%; }
    aside { padding: 14px 12px 32px; }
    h1 { font-size: 17px; }
    textarea { min-height: 96px; }
  }
.rubricBanner{margin:0 0 10px;padding:8px 10px;border:1px solid #f0c07a;background:#3a2a12;color:#ffd79a;border-radius:8px;font-size:12.5px;line-height:1.5}
</style>

<body>
<div id="app">
  <div id="stageWrap">
    <div id="bgLayer"></div>
    <div id="stage"></div>
    <div id="caption"></div>
    <div id="loading">
      <div id="loadTitle">大肥鱼正在醒过来…</div>
      <small id="loadSub">首次要下十几 MB，慢的话可以先换纯文字模式</small>

      <div class="row" style="justify-content:center;margin-top:12px">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>
(function () {
  var HOSTS = ["./","./","https://cdn.jsdelivr.net/gh/jimiao666/dsh-mianshi@main/","https://fastly.jsdelivr.net/gh/jimiao666/dsh-mianshi@main/","https://gcore.jsdelivr.net/gh/jimiao666/dsh-mianshi@main/","https://testingcf.jsdelivr.net/gh/jimiao666/dsh-mianshi@main/"];
  var FILES = ["live2dcubismcore.min.js","pixi.min.js","cubism4.min.js"];
  var head = document.head || document.documentElement;
  var tally = {};
  function note(m) { var d = document.getElementById('loadSub'); if (d) d.textContent = m; }
  function loadOne(f, i) {
    return new Promise(function (res, rej) {
      if (i >= HOSTS.length) { rej(new Error('lib ' + f + '：所有源都没加载上')); return; }
      var settled = false;
      var s = document.createElement('script');
      var timer = setTimeout(function () {
        if (settled) return; settled = true; s.remove();
        note('线路 ' + (i + 1) + ' 太慢，换线路 ' + (i + 2) + '/' + HOSTS.length + '…');
        loadOne(f, i + 1).then(res, rej);
      }, 15000);
      s.src = HOSTS[i] + 'lib/' + f;
      s.onload = function () { if (settled) return; settled = true; clearTimeout(timer); tally[HOSTS[i]] = (tally[HOSTS[i]] || 0) + 1; res(); };
      s.onerror = function () {
        if (settled) return; settled = true; clearTimeout(timer); s.remove();
        note('这条线路不通，换线路 ' + (i + 2) + '/' + HOSTS.length + '…');
        loadOne(f, i + 1).then(res, rej);
      };
      head.appendChild(s);
    });
  }
  var chain = Promise.resolve();
  var fail = null;
  FILES.forEach(function (f) { chain = chain.then(function () { return loadOne(f, 0); }).catch(function (e) { fail = fail || e; }); });
  window.__libsReady = chain.then(function () {
    window.__libsDone = true;
    if (fail) throw fail;
    var best = './'; var n = -1;
    for (var h in tally) if (tally[h] > n) { n = tally[h]; best = h; }
    window.__BASE_FINAL = best;
    return true;
  });
  // 60 秒引擎还没就绪就自动进纯文字模式（加载不取消，成功后刷新可换回出镜版）
  setTimeout(function () {
    if (!window.__libsDone) { try { window.enterTextMode && window.enterTextMode('引擎 60 秒没就绪，先自动进纯文字模式'); } catch (e) {} }
  }, 60000);
})();
</script>
<script>// 评分：优先走 DeepSeek（真 key 才走），没 key 或调用失败就退回本地规则，并在结果里写明后端。
// 本地规则不是「糊弄」，它只看可数的事实：结构词、数字、关键词命中、复盘词；口径写死在返回的 basis 里。


function keySource(){ return null; }

function readKey(){ return null; }

const clamp = (n, a = 0, b = 100) => Math.max(a, Math.min(b, n));

const STRUCT = ['首先', '其次', '然后', '最后', '第一', '第二', '第三', '另一方面', '所以', '因此', '因为', '结果', '比如', '举例', '总结'];
const NUM = /\d+(?:\.\d+)?%?/g;
const REFLECT = /复盘|反思|学到|教训|下次|改进|重来|更好的做法/;

// 一句话判断回答有没有踩到岗位核心要求（本地规则的近似，不是语义匹配）
function jdHits(jdCore, text) {
  const hit = [];
  for (const core of jdCore || []) {
    const raw = String(core.skill || '').replace(/[（(][^)）]*[)）]/g, '');
    const parts = raw.split(/[^\u4e00-\u9fa5A-Za-z0-9]+/).filter((x) => x.length >= 2);
    if (parts.some((p) => text.includes(p.slice(0, Math.min(p.length, 6))))) hit.push(core.skill);
  }
  return hit;
}

function localScore(question, answer, jdCore = []) {
  const text = String(answer || '').trim();
  const len = text.length;
  const nums = (text.match(NUM) || []).length;
  const structHits = STRUCT.filter((w) => text.includes(w));
  const keyHits = (question.keywords || []).filter((w) => text.includes(w));
  const hasReflect = REFLECT.test(text);

  const structure = clamp(35 + structHits.length * 13 + (len >= 180 ? 18 : len >= 90 ? 8 : 0));
  const evidence = clamp(28 + nums * 14 + (len >= 150 ? 16 : 0) + (/我(做|改|写|跑|测|建)/.test(text) ? 8 : 0));
  const relevance = clamp(40 + keyHits.length * 14 + (len >= 80 ? 8 : 0));
  const reflection = clamp(hasReflect ? 76 + (len >= 200 ? 10 : 0) : 42 + (len >= 200 ? 8 : 0));
  const jdHitList = jdHits(jdCore, text);
  const jdMatch = jdCore.length
    ? clamp(45 + jdHitList.length * 18 + (nums ? 5 : 0))
    : relevance;
  const offTarget = jdCore.length > 0 && jdHitList.length === 0;
  const score = Math.round(structure * 0.28 + evidence * 0.32 + relevance * 0.26 + reflection * 0.14);

  const gaps = [];
  if (!nums) gaps.push('整段没有数字：成果、规模、时长都缺量化');
  if (structHits.length < 2) gaps.push('缺少「先…再…最后」这类结构信号，听感是散的');
  if (keyHits.length < 2) gaps.push(`没有点到题目关心的词（${(question.keywords || []).join(' / ')}）`);
  if (!hasReflect) gaps.push('没有复盘：只讲了过程，没讲「下次会怎么改」');
  if (len < 80) gaps.push('回答太短，信息量不够支撑判断');
  if (offTarget) gaps.push('没对上岗位核心要求（' + (jdCore || []).slice(0, 2).map((x) => x.skill).join('、') + '）');

  const strengths = [];
  if (nums) strengths.push(`有 ${nums} 处数字，能支撑「做成了什么」`);
  if (structHits.length >= 2) strengths.push(`结构词命中 ${structHits.length} 个（${structHits.slice(0, 4).join('、')}）`);
  if (keyHits.length) strengths.push(`贴题：${keyHits.join('、')}`);
  if (hasReflect) strengths.push('有复盘意识');

  return {
    score,
    dims: { structure, evidence, relevance, reflection, jdMatch },
    offTarget,
    strengths: strengths.length ? strengths : ['能把事情说完整'],
    gaps: gaps.length ? gaps : ['没有明显缺口，可以补一条反例来证明边界'],
    advice: gaps.length ? '下一版重点补：' + gaps[0] : '保持现在的结构，最后加一句「这套做法什么时候会失效」。',
    backend: 'local-rubric',
    basis: { len, numbers: nums, structureHits: structHits, keywordHits: keyHits, hasReflection: hasReflect, jdHits: jdHitList },
  };
}

async function llmScore(){ throw new Error("offline"); }

// 追问：回答太短 / 没点到关键词 / 证据弱时，让面试官顺着回答再问一句。
// 有 key 走模型（只输出问题本身），没 key 用按题目类型写死的本地追问，别编。
const LOCAL_FOLLOWUP = {
  q1: '你刚才提到的那个项目，具体数字是多少？你本人在里面具体做了什么？',
  q2: '那个难点，你最后用什么办法验证它真的解决了？',
  q3: '如果对方当时坚持不同意你的方案，你会怎么推进？',
  q4: '这次失败之后，你下一次换成了什么做法？效果差多少？',
  q5: '那你会用什么具体信号判断这个人值得再给一次机会？',
  q6: '这套做法在数据变多十倍之后还成立吗？你怎么验证？',
  q7: '对方部门的 KPI 和你的冲突时，你怎么取舍？举个例子。',
  q8: '如果两件事都很急，你按什么标准排先后？说一次真实的取舍。',
  q9: '这个规划里，你最近三个月准备先补哪一块？为什么是它？',
  q10: '你问的这个问题，希望从面试官这里听到什么样的答案？',
};

// 追问（M11.1）：必须引用回答原话，禁止万能句式；模型不合格时换本地引用式
function anchorOf(answer) {
  const t = String(answer || '').replace(/\s+/g, '');
  const clauses = t.split(/[，。；：！？,.;:!?]/).map((x) => x.trim()).filter((x) => x.length >= 4);
  if (!clauses.length) return '';
  const pick = clauses.find((c) => /\d/.test(c)) || clauses[0];
  let cut = pick.slice(0, 16);
  cut = cut.replace(/\d+$/, '').replace(/[，。；：！？,.;:!?]+$/, '');
  return cut.length >= 4 ? cut : pick.slice(0, 12);
}

function localFollowup(question, noReflect, anchor) {
  if (noReflect) {
    return anchor
      ? `你提到「${anchor}」，如果重来一次，你会先改哪一步？`
      : '如果重来一次，你会怎么改进？会先改哪一步？';
  }
  if (anchor) return `你提到「${anchor}」，具体怎么验证的？结果怎么衡量？`;
  return LOCAL_FOLLOWUP[question.id] || '再具体一点：你当时做了什么、结果怎么衡量？';
}

async function followupQuestion(){ throw new Error("offline"); }

async function scoreAnswer(question, answer, opts = {}) {
  const jdCore = Array.isArray(opts.jdCore) ? opts.jdCore.slice(0, 5) : [];
  const local = localScore(question, answer, jdCore);
  if (!keySource()) return { ...local, note: '未配置 DEEPSEEK_API_KEY，本次用本地规则评分' };
  try {
    return await llmScore(question, answer, jdCore);
  } catch (e) {
    return { ...local, note: '模型调用失败，退回本地规则：' + String(e && e.message).slice(0, 160) };
  }
}

/* ===================== M4：多维评估矩阵（业务 40 / 逻辑 30 / 沟通 30） ===================== */

// 默认权重（可被 /api/score 的 weights 覆盖；和《多维面试评估矩阵》文档一致）
const DEFAULT_WEIGHTS = { business: 40, logic: 30, communication: 30 };
const SUB_WEIGHTS = {
  business: { coverage: 60, evidence: 40 },
  logic: { structure: 35, tradeoff: 25, quantified: 20, reflection: 20 },
  communication: { clarity: 30, ownership: 30, conflict: 20, stability: 20 },
};

function normWeights(w) {
  const src = { ...DEFAULT_WEIGHTS, ...(w || {}) };
  const raw = {
    business: Math.max(0, Number(src.business) || 0),
    logic: Math.max(0, Number(src.logic) || 0),
    communication: Math.max(0, Number(src.communication) || 0),
  };
  const total = raw.business + raw.logic + raw.communication;
  if (!total) return { ...DEFAULT_WEIGHTS };
  // 归一化到 100，四舍五入后保证相加为 100
  const b = Math.round((raw.business / total) * 100);
  const l = Math.round((raw.logic / total) * 100);
  return { business: b, logic: l, communication: 100 - b - l };
}

function weighted(subs, weights) {
  let s = 0;
  let w = 0;
  for (const [k, wt] of Object.entries(weights)) {
    if (Number.isFinite(subs[k])) {
      s += subs[k] * wt;
      w += wt;
    }
  }
  return w ? Math.round(s / w) : 0;
}

// 本地规则版 M4：只认可数的证据，口径写在 notes 里，不假装语义理解
function localScoreV4(question, answer, jdCore, weights) {
  const text = String(answer || '').trim();
  const len = text.length;
  const nums = (text.match(NUM) || []).length;
  const structHits = STRUCT.filter((w) => text.includes(w));
  const keyHits = (question.keywords || []).filter((w) => text.includes(w));
  const hasReflect = REFLECT.test(text);
  const weWords = (text.match(/我们/g) || []).length;
  const iWords = (text.match(/我(?![们])/g) || []).length;
  const tradeoffHits = ['取舍', '权衡', '备选', '放弃', '宁可', '优先', '代价', '因为'].filter((w) => text.includes(w));
  const conflictHits = ['分歧', '冲突', '不同意', '协调', '沟通', '说服', '对方'].filter((w) => text.includes(w));
  const blameHits = ['都怪', '领导不行', '公司不行', '不是我的问题', '没办法', '背锅'].filter((w) => text.includes(w));
  const hitList = jdHits(jdCore, text);
  const hasJd = jdCore.length > 0;

  const coverage = hasJd
    ? clamp(38 + (hitList.length / Math.min(jdCore.length, 3)) * 55 + (nums ? 5 : 0))
    : clamp(45 + keyHits.length * 12 + (len >= 120 ? 8 : 0));
  const evidence = clamp(30 + nums * 13 + (len >= 150 ? 15 : 0) + (/我(做|改|写|跑|测|建)/.test(text) ? 8 : 0));
  const structure = clamp(32 + structHits.length * 12 + (len >= 180 ? 16 : len >= 90 ? 8 : 0));
  const tradeoff = clamp(30 + tradeoffHits.length * 14 + (len >= 200 ? 10 : 0));
  const quantified = clamp(28 + nums * 15 + (/\d+%/.test(text) ? 8 : 0));
  const reflection = clamp(hasReflect ? 74 + (len >= 200 ? 12 : 0) : 40 + (len >= 200 ? 6 : 0));
  const clarity = clamp(34 + structHits.length * 11 + (len >= 60 && len <= 400 ? 14 : 6));
  const ownership = clamp(weWords > iWords * 2 && weWords >= 3 ? 48 : 68 + Math.min(iWords, 3) * 6);
  const conflict = clamp(conflictHits.length ? 62 + conflictHits.length * 8 : 44);
  const stability = clamp((len < 40 ? 45 : 66) + (blameHits.length ? -18 : 6) - (len > 600 ? 6 : 0));

  const subs = {
    business: { coverage, evidence },
    logic: { structure, tradeoff, quantified, reflection },
    communication: { clarity, ownership, conflict, stability },
  };
  const dims = {};
  for (const k of Object.keys(SUB_WEIGHTS)) dims[k] = weighted(subs[k], SUB_WEIGHTS[k]);
  const w = normWeights(weights);
  const overall = Math.round((dims.business * w.business + dims.logic * w.logic + dims.communication * w.communication) / 100);

  const gaps = [];
  if (hasJd && !hitList.length) gaps.push('没对上岗位核心要求（' + jdCore.slice(0, 2).map((x) => x.skill).join('、') + '）');
  if (!nums) gaps.push('没有数字：结果、规模、时长都缺量化（D2.3 未展示）');
  if (!hasReflect) gaps.push('缺复盘：没讲「下次会怎么改」（D2.4 未展示）');
  if (weWords > iWords * 2 && weWords >= 3) gaps.push('整段都是「我们」，看不出你个人负责什么（D3.2 未展示）');
  if (blameHits.length) gaps.push('出现把问题归因给别人的表述（' + blameHits.slice(0, 2).join('、') + '），抗压维度扣分');
  if (len < 60) gaps.push('回答太短，信息量不足以支撑判断（记「未展示」，不记 0）');

  const strengths = [];
  if (nums) strengths.push(`有 ${nums} 处数字，能支撑「做成了什么」`);
  if (structHits.length >= 2) strengths.push(`结构信号 ${structHits.slice(0, 3).join('、')}，听感有条理`);
  if (tradeoffHits.length) strengths.push(`讲到了取舍（${tradeoffHits.slice(0, 2).join('、')}）`);
  if (hasReflect) strengths.push('有复盘意识，承认问题并给了改进方向');
  if (hasJd && hitList.length) strengths.push('贴岗位：' + hitList.slice(0, 2).join('、'));

  return {
    version: 'm4',
    score: overall,
    overall,
    dims,
    subs,
    weights: w,
    redline: null,
    evidence: [],
    offTarget: hasJd && hitList.length === 0,
    strengths: strengths.length ? strengths : ['能把事情说完整'],
    gaps: gaps.length ? gaps : ['没有明显缺口，可以补一条反例来证明边界'],
    advice: gaps.length ? '下一版重点补：' + gaps[0] : '保持现在的结构，最后加一句「这套做法什么时候会失效」。',
    verdict: '待定',
    backend: 'local-rubric',
    basis: { len, numbers: nums, structureHits: structHits, keywordHits: keyHits, hasReflection: hasReflect, jdHits: hitList, weWords, iWords },
    notes: ['本地规则：按结构词/数字/关键词/复盘词计数，不做语义判断'],
  };
}

const V4_SYSTEM = `你是资深结构化面试评分员。按「行为锚定」给候选人的回答打分，只输出一个 JSON 对象。

【三维与子项（权重固定）】
business 业务匹配 40%：coverage JD 要求覆盖率 60 / evidence 证据强度 40
logic 逻辑与复盘 30%：structure 结构完整度 35 / tradeoff 因果与取舍 25 / quantified 量化 20 / reflection 反思深度 20

{"subs":{"business":{"coverage":0,"evidence":0},"logic":{"structure":0,"tradeoff":0,"quantified":0,"reflection":0},"communication":{"clarity":0,"ownership":0,"conflict":0,"stability":0}},

不要输出 overall、verdict、分数以外的解释性文字。`;

async function llmScoreV4(){ throw new Error("offline"); }

function verdictOf(overall, { redline, dims } = {}) {
  if (redline) return '不通过';
  if (overall >= 80 && (dims?.business ?? 100) >= 70) return '推荐进入下一轮';
  if (overall >= 60 && (dims?.business ?? 100) >= 55) return '待定';
  return '不通过';
}

async function scoreAnswerV4(question, answer, opts = {}) {
  const jdCore = Array.isArray(opts.jdCore) ? opts.jdCore.slice(0, 5) : [];
  const weights = opts.weights || DEFAULT_WEIGHTS;
  const local = localScoreV4(question, answer, jdCore, weights);
  local.verdict = verdictOf(local.overall, { redline: local.redline, dims: local.dims });
  if (opts.offline) return { ...local, note: '离线演示模式：本地规则评分（不联网）' };
  if (!keySource()) return { ...local, note: '未配置 DEEPSEEK_API_KEY，本次用本地规则评分' };
  try {
    const llm = await llmScoreV4(question, answer, jdCore, weights);
    llm.verdict = verdictOf(llm.overall, { redline: llm.redline, dims: llm.dims });
    return llm;
  } catch (e) {
    return { ...local, note: '模型调用失败，退回本地规则：' + String(e && e.message).slice(0, 160) };
  }
}

const S = { phase: 'idle', idx: -1, results: [], busy: false, mute: false, resolveDone: null, expr: null, frames: 0, fpsShown: 0 };

function setPhase(p, why) {
  S.phase = p;
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.p === p));
  if (why) log(`状态 ${p}（${why}）`);
  if (p === 'thinking' || p === 'scoring') setExpression('思考');
  else if (p !== 'idle') setExpression('黑框眼镜');
  else setExpression(null);
}
function setExpression(name) {
  if (!model || S.expr === name) return;
  try {
    if (name) { model.expression(name); S.expr = name; }
    else { model.internalModel.motionManager.expressionManager?.resetExpression?.(); S.expr = null; }
  } catch (e) { log('表情失败：' + e.message); }
}

let app, model, stageEl;
const pose = { aX: 0, aY: 0, aZ: 0, bX: 0, bZ: 0, eL: 1, eR: 1 };

const QS = new URLSearchParams(location.search);

async function prefetchModel() {
  const t0m = performance.now();
  const setBar = (p) => { const b = document.getElementById('loadBar'); if (b) b.style.width = Math.round(p * 100) + '%'; };
  try {
    const j = await (await fetch(DATA.modelUrl)).json();
    const baseUrl = DATA.modelUrl.replace(/[^/]+$/u, '');
    const files = [j.FileReferences?.Moc, ...(j.FileReferences?.Textures || []), j.FileReferences?.Physics].filter(Boolean);
    let bytes = 0, finished = 0, failed = 0;
    const draw = () => {
      const sec = Math.max(0.5, (performance.now() - t0m) / 1000);
      const mbs = bytes / 1048576;
      const speed = mbs / sec;
      const eta = speed > 0.01 ? Math.max(1, Math.round((20 - Math.min(20, mbs)) / speed)) : 0;
      setLoadText('已下载 ' + mbs.toFixed(1) + ' MB · ' + speed.toFixed(2) + ' MB/s' + (finished ? ' · 完成 ' + finished + '/' + files.length : '') + (eta ? ' · 约 ' + eta + ' 秒' : ''));
      setBar(finished / files.length);
      const wp = wakePct(); if (wp) wp.textContent = Math.round((finished / files.length) * 100) + '%';
      const ws = wakeSpeed(); if (ws) ws.textContent = mbs.toFixed(1) + ' MB / ' + speed.toFixed(2) + ' MB/s';
    };
    await Promise.all(files.map(async (f) => {
      try {
        const r = await fetch(baseUrl + f);
        if (!r.ok || !r.body) throw new Error('http ' + r.status);
        const rd = r.body.getReader();
        for (;;) { const { done, value } = await rd.read(); if (done) break; bytes += value.length; draw(); }
      } catch (e) { failed++; }
      finished++;
      draw();
    }));
    if (failed === files.length) throw new Error('全部文件下载失败');
  } catch (e) {
    log('模型下载失败：' + e.message);
    throw e;
  }
}
document.getElementById('btnTextMode').addEventListener('click', () => enterTextMode('手动切换'));

async function boot() {
  stageEl = $('#stage');
  if (TEXT_FIRST) {
    const lb = document.getElementById('textModeLabel');
    const ds = document.getElementById('textModeDesc');
    if (lb) lb.textContent = '先答题，她在后台准备';

  }
  if (!TEXT_ONLY) document.getElementById('bgLayer').style.backgroundImage = "url('" + BASE + "assets/bg-maid-2026-11-20.webp')";
  app = new PIXI.Application({ backgroundAlpha: 0, antialias: false, autoDensity: true, powerPreference: 'high-performance',
    resolution: Math.min(window.devicePixelRatio || 1, 1.25), resizeTo: stageEl });
  stageEl.appendChild(app.view);

    document.getElementById('loading')?.remove();
    document.getElementById('btnStart').disabled = false;
    document.getElementById('textStage').hidden = false;
    stageEl.style.opacity = '0'; stageEl.style.pointerEvents = 'none';
    log('纯文字模式（不加载模型）');

  }
  if (TEXT_FIRST) {
    // 文字先起：立刻能答题，她在后台醒
    document.getElementById('loading')?.remove();
    document.getElementById('btnStart').disabled = false;
    document.getElementById('textStage').hidden = false;
    stageEl.style.opacity = '0'; stageEl.style.pointerEvents = 'none';
    const wl = document.getElementById('wakeLine');
    if (wl) wl.hidden = false;
    log('文字先起：可以先答题，她在后台加载');
  } else {
    window.__slowT = setTimeout(() => { const b = document.getElementById('btnTextMode'); if (b) { b.textContent = '太慢？点这里改用纯文字模式'; b.classList.add('primary'); } }, 15000);
    window.__toTextT = setTimeout(() => enterTextMode('超过 75 秒仍未加载完'), 75000);
  }
  try { await prefetchModel(); } catch (e) { clearTimeout(window.__slowT); clearTimeout(window.__toTextT); enterTextMode(e.message); return; }
  model = await PIXI.live2d.Live2DModel.from(DATA.modelUrl, { autoInteract: false });
  app.stage.addChild(model);
  fit();
  window.addEventListener('resize', fit);
  app.ticker.add(step);
  clearTimeout(window.__slowT); clearTimeout(window.__toTextT);
  document.getElementById('loading')?.remove();
  const bs = document.getElementById('btnStart'); if (bs) { bs.disabled = false; bs.textContent = '开始面试'; }
  log('模型就绪');
  if (TEXT_FIRST) {

}
function fit() {
  if (!model) return;
  const w = app.screen.width, h = app.screen.height;
  const mw = model.width / model.scale.x, mh = model.height / model.scale.y;
  const s = (h * 1.75) / mh;
  model.scale.set(s);
  model.x = w / 2 - (mw * s) / 2;
  model.y = h * 0.02;
}
function core() { return model?.internalModel?.coreModel; }
function step() {
  const dt = app.ticker.deltaMS / 1000;
  const k = 1 - Math.exp(-dt / 0.32);
  const t = performance.now() / 1000;
  const ph = S.phase;
  let axisX = 0, axisY = 0, axisZ = 0, bodyX = 0, bodyZ = 0, eye = 1;
  if (ph === 'listening') { axisZ = 9; axisY = 3.4 * Math.sin(t * 2.6 * Math.PI * 2 / 6.28); axisX = -2; }
  else if (ph === 'thinking' || ph === 'scoring') { axisY = -7; eye = 0.06; bodyZ = -1.5; }
  else if (ph === 'speaking' || ph === 'asking') { axisY = 4.1 * Math.sin(t * 4.1); axisZ = 2.05 * Math.sin(t * 2.05); bodyX = 1.7 * Math.sin(t * 1.7); }
  pose.aX += (axisX - pose.aX) * k; pose.aY += (axisY - pose.aY) * k; pose.aZ += (axisZ - pose.aZ) * k;
  pose.bX += (bodyX - pose.bX) * k; pose.bZ += (bodyZ - pose.bZ) * k; pose.eL += (eye - pose.eL) * k;
  const c = core(); if (!c) return;
  const set = (id, v) => { try { c.setParameterValueById(id, v); } catch (e) {} };
  set('ParamAngleX', pose.aX); set('ParamAngleY', pose.aY); set('ParamAngleZ', pose.aZ);
  set('ParamBodyAngleX', pose.bX); set('ParamBodyAngleZ', pose.bZ);
  if (!S.expr) { set('ParamEyeLOpen', pose.eL); set('ParamEyeROpen', pose.eL); }
  app.renderer.render(app.stage);
}

async function speak(text) {
  const cap = $('#caption');
  cap.textContent = text;
  const src = DATA.voice[text];
  if (S.mute || !src) {
    const ms = Math.min(9000, Math.max(1200, text.length * 180));
    cap.classList.add('on');
    await new Promise((r) => setTimeout(r, ms));
    cap.classList.remove('on');
    return { duration: ms / 1000, silent: true };
  }
  const audio = new Audio(BASE + src);
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.15;
  }
  await Promise.race([actx.resume(), new Promise((r) => setTimeout(r, 1500))]);
  srcNode = srcNode || actx.createMediaElementSource(audio);
  srcNode.connect(analyser); analyser.connect(actx.destination);
  const data = new Uint8Array(analyser.fftSize);
  let playing = true;
  const drive = () => {
    if (!playing) return;
    analyser.getByteTimeDomainData(data);
    let sum = 0; for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / data.length);
    const m = Math.max(0, Math.min(1, (rms - 0.004) * 5.5));
    try { core().setParameterValueById('ParamMouthOpenY', m); } catch (e) {}
    requestAnimationFrame(drive);
  };
  cap.classList.add('on');
  drive();
  await new Promise((resolve) => {
    let done = false;
    const finish = () => { if (done) return; done = true; playing = false; cap.classList.remove('on');
      try { core().setParameterValueById('ParamMouthOpenY', 0); } catch (e) {} resolve(); };
    audio.onended = finish;
    audio.onerror = finish;
    setTimeout(finish, Math.min(15000, (text.length * 260) + 6000));
    audio.play().catch(finish);
  });
  return { duration: audio.duration || 0 };
}

/* ---------- 评分 ---------- */
function renderScore(r) {
  const v = window.SCORE.verdictOf ? window.SCORE.verdictOf(r.overall, { redline: r.redline, dims: r.dims }) : '—';
  $('#scoreNum').textContent = r.overall ?? r.score ?? '—';
  $('#verdict').textContent = '· ' + (r.verdict || v) + '（权重 40/30/30）';
  const dims = r.dims || {};
  const rows = [['business', '业务'], ['logic', '逻辑'], ['communication', '沟通']];
  $('#dims').innerHTML = rows.map(([k, n]) => {
    const val = dims[k] ?? 0;
    return `<div class="dim"><span>${n}</span><span>${val}</span></div><div class="bar"><i style="width:${val}%"></i></div>`;
  }).join('');
  const s = r.subs || {};
  $('#subs').textContent = [
    s.business ? `业务：覆盖 ${s.business.coverage} / 证据 ${s.business.evidence}` : '',
    s.logic ? `逻辑：结构 ${s.logic.structure} / 取舍 ${s.logic.tradeoff} / 量化 ${s.logic.quantified} / 反思 ${s.logic.reflection}` : '',
    s.communication ? `沟通：表达 ${s.communication.clarity} / 主动 ${s.communication.ownership} / 冲突 ${s.communication.conflict} / 稳定 ${s.communication.stability}` : '',
  ].filter(Boolean).join('\n');
  const pts = [...(r.strengths || []).map((x) => '√ ' + x), ...(r.gaps || []).map((x) => '△ ' + x), r.advice ? '→ ' + r.advice : ''].filter(Boolean);
  $('#points').innerHTML = pts.map((x) => `<li>${x}</li>`).join('');
}

/* ---------- 流程 ---------- */
const questions = DATA.questions.slice(0, 10);
const greetings = ['你好，我是大肥鱼，今天由我来面你。别紧张，我们就当聊一聊。'];
async function start() {
  setPhase('asking', '开始');
  $('#btnStart').disabled = true;
  await speak(greetings[0]);
  S.idx = 0; askQuestion();
}
async function askQuestion() {
  const q = questions[S.idx];
  $('#qText').textContent = q.text;
  $('#answer').value = ''; $('#len').textContent = '0 字';
  $('#report').textContent = '进行中…';
  setPhase('asking', '朗读题目');
  await speak('第 ' + (S.idx + 1) + ' 题。' + q.text);
  setPhase('listening', '等你作答');
  $('#btnSubmit').disabled = false;
  $('#answer').focus();
}
async function submit() {
  const q = questions[S.idx];
  const answer = $('#answer').value.trim();
  if (!answer || S.busy) return;
  S.busy = true;
  $('#btnSubmit').disabled = true; $('#btnNext').disabled = true;
  setPhase('thinking', '读你的回答');
  const t = performance.now();
  const r = window.SCORE.localScoreV4(q, answer, [], undefined);
  await new Promise((x) => setTimeout(x, 900));
  renderScore(r);
  S.results.push({ q, r, answer });
  log(`评分 ${r.overall}（本地规则 ${Math.round(performance.now() - t)}ms）`);
  setPhase('speaking', '播报评价');
  await speak(`第 ${S.idx + 1} 题，${r.overall} 分。` + (r.advice || ''));
  S.busy = false;
  setPhase('listening', '看评分');
  $('#btnNext').disabled = false;
  $('#btnFinish').disabled = false;
  $('#btnSubmit').disabled = false;
}
async function next() {
  if (S.idx + 1 >= questions.length) return finish();
  S.idx++;
  await askQuestion();
  $('#btnNext').disabled = true;
}
async function finish() {
  $('#btnNext').disabled = true; $('#btnFinish').disabled = true; $('#btnSubmit').disabled = true;
  const list = S.results.map((x, i) => `第 ${x.q.id ? i + 1 : i + 1} 题 · ${x.q.tag}　<b>${x.r.overall}</b>`).join('<br>');
  const avg = S.results.length ? Math.round(S.results.reduce((a, x) => a + (x.r.overall || 0), 0) / S.results.length) : 0;
  const banner = '<div class="rubricBanner">演示模式 · 本次分数由本地规则给出，不是大模型评估。正式版接 DeepSeek 后才是模型评分。</div>';
  $('#report').innerHTML = `${banner}${list}<br>平均分（${S.results.length} 题）：<b>${avg}</b><br><span style="font-size:12px">本地规则评分（网页演示版，不调模型）</span>`;
  setPhase('idle', '面试结束');
  await speak('今天就到这里，谢谢你。报告在右边，回去慢慢看。');
}

/* ---------- 绑定 ---------- */
(() => {
  $('#btnStart').onclick = () => start();
  $('#btnSubmit').onclick = () => submit();
  $('#btnNext').onclick = () => next();
  $('#btnFinish').onclick = () => finish();
  $('#mute').onchange = (e) => { S.mute = e.target.checked; log('静音=' + S.mute); };
  $('#answer').addEventListener('input', (e) => { $('#len').textContent = e.target.value.trim().length + ' 字'; });
  (window.__libsReady || Promise.resolve()).then(() => {
    if (window.__BASE_FINAL) { BASE = window.__BASE_FINAL; DATA.modelUrl = BASE + 'model/大肥鱼.model3.json'; }
    return boot();
  }).catch((e) => {
    // 不再 innerHTML 整块替换——保住「纯文字模式」「重试」两个按钮，报错只换标题文字
    const t = document.getElementById('loadTitle');
    const ld = document.getElementById('loading');
    if (t) t.textContent = '模型没起来：' + e.message + '，点下方「纯文字模式」还能继续面试。';
    else if (ld) ld.innerHTML = '<div>模型没起来：' + e.message + '</div>';
    log('boot 失败：' + e.message);
  });
})();
</script>
